<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="Logo/ByteBuyLogo.png" type="image/x-icon">
  <title>Admin Login | BYTEBUY</title>
  <style>
    body {
      background: linear-gradient(135deg, #0a2441, #131414, #0b1a38);
      color: white;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .form-container {
      background-color: rgba(33, 33, 34, 0.95);
      border-radius: 16px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 25px;
      width: 360px;
      animation: fadeIn 0.8s ease-in-out;
    }

    .logo {
      width: 80px;
      height: 80px;
      background: url("Logo/ByteBuyLogoWithText.png") no-repeat center/cover;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    .form-container h2 {
      margin-bottom: 15px;
      color: #f1f1f1;
      font-weight: 600;
    }

    form {
      display: flex;
      flex-flow: column;
      width: 100%;
    }

    input, button {
      margin: 8px 0;
      padding: 12px;
      font-size: 15px;
      border-radius: 6px;
      border: none;
      outline: none;
      transition: 0.3s;
    }

    input {
      background: #34495e;
      color: white;
    }

    input:focus {
      background: #3e5871;
      box-shadow: 0 0 8px rgba(76, 111, 175, 0.7);
    }

    input::placeholder {
      color: #aaa;
    }

    button {
      background-color: #4c6faf;
      color: white;
      display:flex;
      justify-content:center;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #3b5789;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    a {
      text-decoration: underline;
      color: lightgreen;
      cursor: pointer;
    }

    #message {
      font-weight: bold;
      text-align: center;
      margin-top: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    .spinner {
      border: 3px solid #fff;
      border-top: 3px solid transparent;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 0.8s linear infinite;
    }
    #btn{
        text-align:center;
    }
    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

  </style>
</head>
<body>
  <div class="form-container">
    <div class="logo"></div>
    <h2>Welcome Admin!</h2>
    <form id="signupForm">
      <input type="email" id="signup-email" placeholder="Email Address" autocomplete="email" required />
      <input type="password" id="signup-password" placeholder=" Password" minlength="6" required />
      <button type="submit" id='btn'>Login </button>
    </form>
    <p id="message"></p>
    <p>Back to <a href="bytebuy.html">Home</a></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByNiud6xGiCo7_7SDzdeQ8Ij2_h5P_RFs",
      authDomain: "bytebuy-app-546b1.firebaseapp.com",
      projectId: "bytebuy-app-546b1",
      storageBucket: "bytebuy-app-546b1.appspot.com",
      messagingSenderId: "604573096583",
      appId: "1:604573096583:web:ac924bd0d28c71f30df622"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const signupForm = document.getElementById("signupForm");
    const message = document.getElementById("message");
    const button =document.getElementById('btn')
    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      button.innerHTML=`<div class='spinner'></div>`
      button.diabled=true
      const email = document.getElementById("signup-email").value.trim();
      const password = document.getElementById("signup-password").value;

      try {
         await signInWithEmailAndPassword(auth, email, password);
        message.innerText = "Signup successful! Redirecting...";
        message.style.color = "lightgreen";

        setTimeout(() => {
          window.location.href = "./oneadmin_products.html";
        }, 2000);

      } catch (error) {
        message.innerText = "Error: " + error.message;
        message.style.color = "red"; 
        setTimeout(() => {
            message.innerText=''
        }, 2900);
      }
      finally{
        button.innerHTML='Login'
        button.diabled=false
      }
    });
  </script>
</body>
</html>
