<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../Logo/ByteBuyLogo.png" type="image/x-icon">
  <title>Byte-Buy Login</title>
  <style>
    
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg,#2c0fed,#186bfa, #0d27ac, #156af3e6);
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      
    }

    .container {
       width: 360px;
      max-width: 100%;
      padding: 30px 30px;
      border-radius: 12px;
      background: #fff;
      text-align: center;
      box-shadow: 0 6px 25px rgba(0,0,0,0.15);
      animation: fadeIn 0.8s ease-in-out;
    }

    .logo {
      width: 45%;
      height: 90px;
      background: url("../Logo/ByteBuyLogoWithText.png") no-repeat center/cover;
      border-radius: 50%;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      font-weight: bolder;
      font-size: 3em;
    /* box-shadow: 0 3px 10px rgba(0,0,0,0.2); */
    }
  
    h2 {
      margin: 5px 0 8px;
      font-size: 24px;
      color: #1e2f97;
    }

    p {
      color: #555;
      margin-bottom: 20px;
      font-size: 14px;
    }

    #loginForm {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .input-box {
      text-align: left;
      display: flex;
      flex-direction: column;
    }

    .input-box label {
      color: #333;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 600;
    }

    .input-box input {
      padding: 12px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-box input:focus {
      border-color: #1e2f97;
    }

    .login-btn ,#resetBtn{
      padding: 12px;
      color: #fff;
      background: #1e2f97;
      border: none;
      font-size: 16px;
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .login-btn:hover, #resetBtn{
      background: #1261e1;
    }
    .reset-input{
      padding: 12px;
      font-size: 14px;
      width: 100%;
      border-radius: 6px;
      border: 1px solid #ccc;
      outline: none;
      transition: border-color 0.3s;
    }
    .reset-input input:focus {
      border-color: #1e2f97;
    }

    /* Spinner inside button */
    .spinner {
      border: 3px solid #fff;
      border-top: 3px solid transparent;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .forgot, .signup {
      margin-top: 12px;
      font-size: 14px;
    }

    .forgot a, .signup a , .login-redirect{
      color: #1e2f97;
      text-decoration: none;
      font-weight: 600;
    }

    .forgot a:hover, .signup a:hover, .login-redirect {
      text-decoration: underline;
    }

    .support {
      margin-top: 20px;
      color: #666;
      font-size: 12px;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #fff;
      padding: 25px 30px;
      border-radius: 10px;
      text-align: center;
      width: 300px;
      animation: popIn 0.4s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }

    .modal-content h3 {
      margin: 0;
      font-size: 20px;
      color: #1e2f97;
    }

    .modal-content p {
      margin: 12px 0;
      font-size: 14px;
      color: #444;
    }

    .close-btn {
      margin-top: 15px;
      padding: 8px 16px;
      background: #1e2f97;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    
      @media (max-width:767px) {
          body {
      font-family: "Segoe UI", Arial, sans-serif;
      /* background: linear-gradient(135deg,#2c0fed,#186bfa, #0d27ac, #156af3e6); */
      margin: 0;
      /* min-height: 100vh; */
      display: flex;
      justify-content: center;
      height: auto;
      background: #ffffff;
      align-items: start;
      /* padding: 10px; */
    }

    .container {
       width: 100%;
      max-width: 100%;
      padding: 40px 30px;
      height: 100%;
      border-radius: 12px;
      /* background: #fff; */
      text-align: center;
      box-shadow: none;
      animation: fadeIn 0.8s ease-in-out;
    }

    }
  </style>
</head>
<body>
  <div class="container" id="loginFormContainer">
    <div class="logo">
    <!-- <img src="" alt=""> -->
    </div>
    <h2>Welcome back!</h2>
    <p>Log back into your Byte-Buy account.</p>

    <form id="loginForm">
      <div class="input-box">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="Enter email" required />
      </div>

      <div class="input-box">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Enter password" required minlength="6" />
      </div>

      <button type="submit" class="login-btn">
        <span class="btn-text">Login</span>
        <div class="spinner"></div>
      </button>
    </form>
  <!-- Password Reset -->
    <div class="forgot">
      <a href="#"  data-action="show-reset">Forgot your password?</a>
    </div>

    <div class="signup">
      <p>Don’t have an account? <a href="signup.html">Create one</a></p>
    </div>

    <div class="support">
      <p>For further support, visit our help center or contact customer service.</p>
    </div>
    <div class="signup">  
    <p >Back to <a href="/">Home</a></p></div>

  <!-- Success Modal -->
  <div id="successModal" class="modal">
    <div class="modal-content">
      <h3>Login Successful 🎉</h3>
      <p>Redirecting to your account...</p>
      <button class="close-btn" onclick="closeModal()">Okay</button>
    </div>
  </div>
<!-- Pawssword reset form -->
  <div id="resetFormContainer" class="container" style="display: none">
    <form id="resetForm">
     <div style="width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px;">
      <input class="reset-input"
      type="email"
      id="reset-email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    />
    <button type="button" id="resetBtn">Reset Password
      <div class="spinner2"></div>
    </button>
     </div>
      <p id="resetMessage"></p>
      <a class="login-redirect" href="#" data-action="show-login">Back to Login</a>
    </form>

    <div id="loading" style="display: none">Loading...</div>
  </div>
</div>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } 
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } 
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyByNiud6xGiCo7_7SDzdeQ8Ij2_h5P_RFs",
    authDomain: "bytebuy-app-546b1.firebaseapp.com",
    projectId: "bytebuy-app-546b1",
    storageBucket: "bytebuy-app-546b1.appspot.com",
    messagingSenderId: "604573096583",
    appId: "1:604573096583:web:ac924bd0d28c71f30df622"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const form = document.getElementById("loginForm");
  const modal = document.getElementById("successModal");
  const loginBtn = document.querySelector(".login-btn");
  const btnText = document.querySelector(".btn-text");
  const spinner = document.querySelector(".spinner");

  // Grab modal <p> so we can update it
  const modalMessage = modal.querySelector("p");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();      
    const email = document.getElementById("login-email").value;
    const password = document.getElementById("login-password").value;

    // Show spinner
    btnText.textContent = "Processing...";
    spinner.style.display = "block";
    loginBtn.disabled = true;

    try {
      const userCred = await signInWithEmailAndPassword(auth, email, password);
      const user = userCred.user;

      // Try to fetch user profile from Firestore
      let fullName = user.displayName || "User";
      const docRef = doc(db, "users", user.uid);
      const docSnap = await getDoc(docRef);

      if (docSnap.exists()) {
        const userData = docSnap.data();
        fullName = ` ${userData.lastName}`;
      }

      // Save for use in headers across site
      localStorage.setItem("userName", fullName);

      // Update modal greeting
      modal.querySelector("h3").textContent = `Welcome back, ${fullName}! 🎉`;
      modalMessage.textContent = "Redirecting to your account...";

      // Show modal
      modal.style.display = "flex";
      setTimeout(() => window.location.href = "/", 3500);

    } catch (error) {
    alert("Login failed: " + error.message);
    } finally {
      btnText.textContent = "Login";
      spinner.style.display = "none";
      loginBtn.disabled = false;
    }
  });

  // Close modal
  function closeModal() {
    modal.style.display = "none";
    window.location.href = "/";
  }
  window.closeModal = closeModal;

  // Reset password
  document.getElementById("resetBtn").addEventListener("click", () => {
    const email = document.getElementById("reset-email").value;
    const msg = document.getElementById("resetMessage");
    sendPasswordResetEmail(auth, email)
      .then(() => { msg.innerText = "Check your inbox"; msg.style.color = "lightgreen"; })
      .catch((err) => { msg.innerText = "Error: " + err.message; msg.style.color = "red"; });
  });
        
  // Toggle forms
  document.querySelectorAll("a[data-action='show-reset']").forEach(a => a.addEventListener("click", (e) => {
    e.preventDefault();
    document.getElementById("loginFormContainer").style.display = "none";
    document.getElementById("resetFormContainer").style.display = "block";
  }));
  
  document.querySelectorAll("a[data-action='show-login']").forEach(a => a.addEventListener("click", (e) => {
    e.preventDefault();
    document.getElementById("resetFormContainer").style.display = "none";
    document.getElementById("loginFormContainer").style.display = "block";
  }));
</script>

</body>
</html>
